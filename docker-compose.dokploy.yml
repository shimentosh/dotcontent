# Content OS on Dokploy.
#
# Two containers — the API and the console — and **no database**, because the
# database is Dokploy's own Database service. That is the difference from
# `docker-compose.prod.yml`, along with the proxy: Dokploy runs Traefik on :80
# and :443 already, and the prod file ships one, so the two would fight for a
# socket.
#
# So nothing here publishes a port and nothing here routes. Dokploy's proxy
# reaches these containers over `dokploy-network`, and the domains, the
# certificates and the routing are set in Dokploy's UI rather than in labels.
# Two places writing Traefik rules for one service is how a deploy ends up
# serving the wrong container.
#
# `DATABASE_URL` is the internal connection string Dokploy shows on the
# database's own page. It is taken whole rather than assembled from a host, a
# user and a password here: Dokploy owns those, it can rotate them, and a
# second copy of a credential is a second thing to keep in step.
#
#   Dokploy → Create Service → Compose
#   Compose Path: docker-compose.dokploy.yml
#
# See docs/DEPLOYING.md, "Deploying on Dokploy", for every field to fill in and
# for the one setting that breaks the desktop app without saying anything.

services:
  # The backend the browser and every worker call.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      # Dokploy's database, copied from its page. Internal hostname — it never
      # leaves the network, which is why the database has no domain of its own.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from the Dokploy database page}
      PORT: "4000"
      NODE_ENV: production
      # Encrypts the API keys in the settings table. The API refuses to start
      # without it in production, on purpose: the fallback it used to have was
      # derived from DATABASE_URL, and the day somebody rotates the database
      # password every stored key silently decrypts to nothing.
      CONTENTOS_SECRET: ${CONTENTOS_SECRET:?set CONTENTOS_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # The console's origin, and it does two jobs. It is the CORS allow-list,
      # and it is the only origin the desktop app's sign-in hand-off may
      # redirect to — so it must equal the address the app was built with as
      # CONTENTOS_CONSOLE_URL, exactly. Wrong, and nothing errors: teammates
      # are just asked to sign in a second time inside the app.
      WEB_ORIGIN: https://${APP_HOST:?set APP_HOST}
    volumes:
      # Frames and the audio a worker sends back. Without this a redeploy loses
      # them and every still the researcher already read 404s.
      - sourcedata:/app/.data
    # Attach the API's domain (API_HOST) to port 4000 in Dokploy.
    networks: [dokploy-network]

  # The console: Next.js, frontend only.
  app:
    build:
      context: .
      args:
        # Read by the browser bundle, so it is fixed when the image is built,
        # not when it starts. Change API_HOST and this image has to be rebuilt;
        # restarting it will not do. In Dokploy this belongs under the
        # service's **build arguments**, not its environment variables — the
        # two look alike in the UI and only one of them reaches a `next build`.
        NEXT_PUBLIC_API_URL: https://${API_HOST:?set API_HOST}
    restart: unless-stopped
    environment:
      PORT: "3333"
    depends_on:
      - api
    # Attach the console's domain (APP_HOST) to port 3333 in Dokploy.
    networks: [dokploy-network]

volumes:
  # Frames and audio. Big, re-fetchable, and worth keeping across a deploy —
  # which is why it is a volume rather than something inside the container.
  # The database is Dokploy's and is backed up there.
  sourcedata:

networks:
  # Created by Dokploy itself — hence `external`. It is also how these two
  # reach the database service, so the database has to be on it as well.
  # If your install named it something else, this is the line to change.
  dokploy-network:
    external: true
