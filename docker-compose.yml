# The database Content OS runs on.
#
#   docker compose up -d
#
# Port 5437 because 5432, 5433 and 5436 are already taken on this machine by
# other projects' databases — a fresh clone elsewhere can move it back.
services:
  postgres:
    image: postgres:17-alpine
    container_name: contentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: contentos
      POSTGRES_DB: contentos
    ports:
      - "5437:5432"
    volumes:
      - contentos-pgdata:/var/lib/postgresql/data
    # The app waits on this rather than on the port opening: Postgres accepts
    # connections briefly during init and then restarts, and a migration that
    # lands in that window fails in a way that looks like a bug in the schema.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos -d contentos"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  contentos-pgdata:
