# The whole console on one server: the app, its database, and a reverse proxy
# that gets a TLS certificate on its own.
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything the team sees lives in the `pgdata` volume. Back that up and you
# have backed up the workspace.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: contentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos -d contentos"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the app talks to it, over the compose network.

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://contentos:${POSTGRES_PASSWORD}@postgres:5432/contentos
      PORT: "3333"
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations first, then the server — a deploy that adds a column must not
    # take traffic against a database that has not got it yet.
    command: >
      sh -c "node scripts/migrate.mjs && node server.js"
    labels:
      - traefik.enable=true
      - traefik.http.routers.contentos.rule=Host(`${APP_HOST:?set APP_HOST}`)
      - traefik.http.routers.contentos.entrypoints=websecure
      - traefik.http.routers.contentos.tls.certresolver=le
      - traefik.http.services.contentos.loadbalancer.server.port=3333

  proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

volumes:
  pgdata:
  letsencrypt:
