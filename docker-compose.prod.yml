# The whole console on one server: the app, its database, and a reverse proxy
# that gets a TLS certificate on its own.
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything the team sees lives in the `pgdata` volume. Back that up and you
# have backed up the workspace.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: contentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos -d contentos"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the app talks to it, over the compose network.

  # The backend: NestJS, on its own hostname. Every browser call goes here.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://contentos:${POSTGRES_PASSWORD}@postgres:5432/contentos
      PORT: "4000"
      # The web app's origin, for CORS. Cookies cross from APP_HOST to
      # API_HOST because both sit under COOKIE_DOMAIN — see .env.production.
      WEB_ORIGIN: https://${APP_HOST:?set APP_HOST}
      # The first account, made at boot while `users` is empty. Optional, and
      # read only because it is named here — a compose `.env` fills in the
      # `${…}` above, it does not reach the process. See
      # docker-compose.dokploy.yml for the whole of that trap.
      CONTENTOS_OWNER_EMAIL: ${CONTENTOS_OWNER_EMAIL:-}
      CONTENTOS_OWNER_PASSWORD: ${CONTENTOS_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The downloads live here: every fetched video, and the stills cut out of
      # it. Without this they are inside the container, so a redeploy loses
      # them and every frame the researcher already read 404s.
      - sourcedata:/app/.data
    # Migrations and the seed run inside the API as it starts, before it
    # listens — a deploy that adds a column never takes traffic against a
    # database that has not got it yet.
    labels:
      - traefik.enable=true
      - traefik.http.routers.contentos-api.rule=Host(`${API_HOST:?set API_HOST}`)
      - traefik.http.routers.contentos-api.entrypoints=websecure
      - traefik.http.routers.contentos-api.tls.certresolver=le
      - traefik.http.services.contentos-api.loadbalancer.server.port=4000

  # The web app: Next.js, frontend only. It knows the API's address at build
  # time, which is why the origin is a build arg and not a runtime variable.
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:?set API_HOST}
    restart: unless-stopped
    environment:
      PORT: "3333"
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.contentos.rule=Host(`${APP_HOST:?set APP_HOST}`)
      - traefik.http.routers.contentos.entrypoints=websecure
      - traefik.http.routers.contentos.tls.certresolver=le
      - traefik.http.services.contentos.loadbalancer.server.port=3333

  proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

volumes:
  pgdata:
  # Videos and frames. Big, and re-fetchable — worth keeping across a deploy,
  # not worth putting in the nightly dump beside the database.
  sourcedata:
  letsencrypt:
