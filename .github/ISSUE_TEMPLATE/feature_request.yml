name: Feature request
description: An idea that would make dotcontent more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. A sketch or an example output helps.
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Workarounds you use now, or other tools that do it well.
