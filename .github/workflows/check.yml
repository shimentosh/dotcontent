# Typecheck, lint, tests, and a production build — the same four things
# `npm run check` and `npm run build:check` do on a laptop.
#
# No database and no model: nothing here talks to Postgres or spends a credit.
# The tests are the pure ones in tests/, and the build only has to compile.
name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run check
      # Into .next-check, so it can never be confused with a dev server's
      # output — see next.config.ts.
      - run: npm run build:check
      # The API compiles on its own; the image is what a server runs.
      - run: npm run build --prefix api
